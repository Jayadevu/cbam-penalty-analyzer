name: Deploy CBAM App
on:
  push:
    branches: [ main ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        registry: ca7a9a4e2258acr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
        
    - name: Build and Push
      run: |
        docker build -t ca7a9a4e2258acr.azurecr.io/cbam-penalty-app:${{ github.sha }} .
        docker push ca7a9a4e2258acr.azurecr.io/cbam-penalty-app:${{ github.sha }}
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Update Container App
      run: |
        az containerapp update --name cbam-penalty-app --resource-group cbam-esg-rg-v2 --image ca7a9a4e2258acr.azurecr.io/cbam-penalty-app:${{ github.sha }}